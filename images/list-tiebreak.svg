<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>승진후보자명부 동점자 처리 기준</title>
<desc>평정 합산점수가 같을 때 지방공무원 평정규칙 제30조에 따라 ①근무성적평정점과 실적가산점의 합 ②현 직급 근무기간 ③현 계급 근무기간 ④5급 이하 계속 근무기간 순으로 순위를 정하는 기준을 보여주는 그림</desc>
<defs>
  <style>
    .navy{fill:#0f2340} .gold{fill:#c8a84b}
    .ink{fill:#1a1a2e} .muted{fill:#6b6b7a}
    .lbl{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700}
    .sub{font-family:'Noto Serif KR',serif;font-size:12.5px}
    .small{font-family:'Noto Serif KR',serif;font-size:11px}
    .mono{font-family:'DM Mono',monospace;font-size:22px;font-weight:700}
    .rank{font-family:'DM Mono',monospace;font-size:13px;font-weight:700}
  </style>
</defs>
<rect width="700" height="300" fill="#faf8f3"/>

<text x="350" y="28" text-anchor="middle" class="lbl navy">동점자가 나오면? — 평정규칙 제30조 순위 기준</text>

<rect x="200" y="42" width="130" height="52" rx="8" fill="#ffffff" stroke="#d8d0be" stroke-width="1"/>
<text x="265" y="64" text-anchor="middle" class="sub ink" font-weight="700">A 공무원</text>
<text x="265" y="84" text-anchor="middle" class="mono navy">87.5점</text>
<text x="350" y="74" text-anchor="middle" class="lbl" fill="#c0392b">=</text>
<rect x="370" y="42" width="130" height="52" rx="8" fill="#ffffff" stroke="#d8d0be" stroke-width="1"/>
<text x="435" y="64" text-anchor="middle" class="sub ink" font-weight="700">B 공무원</text>
<text x="435" y="84" text-anchor="middle" class="mono navy">87.5점</text>

<text x="350" y="118" text-anchor="middle" class="sub" fill="#c0392b" font-weight="700">합산 점수가 같을 때 → 아래 순서로 판가름</text>

<!-- ① -->
<rect x="20" y="132" width="150" height="112" rx="12" fill="#0f2340"/>
<circle cx="45" cy="156" r="14" fill="#c8a84b"/>
<text x="45" y="161" text-anchor="middle" class="rank navy">1</text>
<text x="95" y="182" text-anchor="middle" class="sub" fill="#c8a84b" font-weight="700">근평점</text>
<text x="95" y="200" text-anchor="middle" class="sub" fill="#c8a84b" font-weight="700">+ 실적가산점</text>
<text x="95" y="224" text-anchor="middle" class="small" fill="#c7cde0">높은 사람 먼저</text>

<text x="180" y="192" text-anchor="middle" class="lbl gold">›</text>

<!-- ② -->
<rect x="190" y="132" width="150" height="112" rx="12" fill="#0f2340"/>
<circle cx="215" cy="156" r="14" fill="#c8a84b"/>
<text x="215" y="161" text-anchor="middle" class="rank navy">2</text>
<text x="265" y="182" text-anchor="middle" class="sub" fill="#c8a84b" font-weight="700">현 직급</text>
<text x="265" y="200" text-anchor="middle" class="sub" fill="#c8a84b" font-weight="700">근무기간</text>
<text x="265" y="224" text-anchor="middle" class="small" fill="#c7cde0">긴 사람 먼저</text>

<text x="350" y="192" text-anchor="middle" class="lbl gold">›</text>

<!-- ③ -->
<rect x="360" y="132" width="150" height="112" rx="12" fill="#0f2340"/>
<circle cx="385" cy="156" r="14" fill="#c8a84b"/>
<text x="385" y="161" text-anchor="middle" class="rank navy">3</text>
<text x="435" y="182" text-anchor="middle" class="sub" fill="#c8a84b" font-weight="700">현 계급</text>
<text x="435" y="200" text-anchor="middle" class="sub" fill="#c8a84b" font-weight="700">근무기간</text>
<text x="435" y="224" text-anchor="middle" class="small" fill="#c7cde0">긴 사람 먼저</text>

<text x="520" y="192" text-anchor="middle" class="lbl gold">›</text>

<!-- ④ -->
<rect x="530" y="132" width="150" height="112" rx="12" fill="#f2ede3"/>
<circle cx="555" cy="156" r="14" fill="#0f2340"/>
<text x="555" y="161" text-anchor="middle" class="rank" fill="#c8a84b">4</text>
<text x="605" y="182" text-anchor="middle" class="sub ink" font-weight="700">5급 이하 계속</text>
<text x="605" y="200" text-anchor="middle" class="sub ink" font-weight="700">근무기간</text>
<text x="605" y="224" text-anchor="middle" class="small muted">긴 사람 먼저</text>

<text x="350" y="272" text-anchor="middle" class="small muted">※ ④까지 같으면 명부 작성권자가 미리 정한 기준을 따릅니다. (지방공무원 평정규칙 제30조)</text>
</svg>
